name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The shared environment without the per-model extras, on CPU torch.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[bench,leaderboard,dev]"
      - run: pytest -q
