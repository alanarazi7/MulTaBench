[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multabench"
version = "0.1.0"
description = "Benchmarking multimodal tabular learning: tables whose columns include text or images"
readme = "README.md"
requires-python = ">=3.11"
# The core: loading the datasets, their splits and the cached embeddings.
dependencies = [
    "huggingface_hub",
    "numpy",
    "pandas >= 2.2.2",
    "pyarrow",
    "scikit-learn",
]

# `bench` runs benchmark.py; one extra per model package on top of it. requirements.txt locks the shared .venv,
# which has all of them.
[project.optional-dependencies]
bench = [
    "autogluon.core",
    "nvidia-ml-py",
    "peft",
    "pillow",
    "psutil",
    "python-dotenv",
    "setuptools < 82",
    "skrub",
    "torch >= 2.6.0",
    "torchvision",
    "transformers >= 4.49.0",
]
catboost = ["catboost"]
lightgbm = ["lightgbm"]
xgboost = ["xgboost"]
pytabkit = ["pytabkit"]
tabicl = ["tabicl >= 2.0.3"]
tabdpt = ["tabdpt >= 1.1.9"]
tabpfn = ["tabpfn >= 9.2.0"]
contexttab = ["sap_rpt_oss @ git+https://github.com/SAP-samples/sap-rpt-1-oss@v1.1.2"]
tabstar = ["tabstar >= 1.1.15"]
# Not on PyPI yet; the commit TabArena benchmarked.
kumo = [
    "structured-data-models @ git+https://github.com/NVIDIA/structured-data-models.git@98f61289c7a4e1bce3b33771223ac2e123b63f19",
]
autogluon-mm = ["autogluon.multimodal"]
dev = ["matplotlib", "pytest", "streamlit"]

[tool.setuptools.packages.find]
include = ["multabench*"]
